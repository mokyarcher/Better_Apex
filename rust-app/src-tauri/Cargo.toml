[package]
name = "better-apex-lab"
version = "0.2.0"
edition = "2021"
default-run = "better-apex-lab"

[lib]
name = "better_apex_lab"

[[bin]]
name = "better-apex-lab"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "compatibility-cli"
path = "src/bin/compatibility.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
libloading = "0.8"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
tauri = { version = "=2.12.5", optional = true, features = ["tray-icon"] }
tauri-plugin-dialog = { version = "=2.8.4", optional = true }
windows = { version = "=0.61.3", features = [
  "Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams",
  "Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_WinRT", "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"
] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "unwind"
